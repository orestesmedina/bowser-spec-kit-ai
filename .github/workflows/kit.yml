name: Pruebas del kit

# Solo del repositorio del kit: no se copia a los proyectos (está en NUNCA, en scripts/instalar_kit.py).
# Corre lo mismo que `make test-kit`, sin permitir pruebas omitidas.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: make test-kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historial y tags completos: la prueba de actualización parte del último tag publicado.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pruebas del kit
        run: make test-kit STRICT=1
